AWSTemplateFormatVersion: '2010-09-09'
Description: Node group stack (node IAM role). Floci's CloudFormation ignores Nodegroup ScalingConfig and InstanceTypes, so the node group itself is created with the EKS API in 04-create-cluster.ps1.
Resources:
  NodeInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: eksctl-nextwork-eks-cluster-NodeInstanceRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
Outputs:
  NodeRoleArn:
    Value: !GetAtt NodeInstanceRole.Arn
